name: reproduce
on: workflow_dispatch
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore EEG downloads from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: ~/mne_data
          key: eegbci-${{ github.run_id }}
          restore-keys: eegbci-
      - name: Part A, simulations
        run: python part_a.py
      - name: Part B, brain rhythms
        run: python part_b.py
      - name: Keep EEG downloads for next time, even if this run fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/mne_data
          key: eegbci-${{ github.run_id }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md results figures
          git diff --cached --quiet || git commit -m "Update results"
          git push
